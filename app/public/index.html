<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Search Engine — Profile</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Auth (login / signup) -->
  <div id="auth" class="login" hidden>
    <form id="authForm" class="login-card">
      <h1>Job Search Engine</h1>
      <p id="authSub" class="muted">Sign in to your account.</p>
      <input id="name" type="text" placeholder="Your name" autocomplete="name" hidden />
      <input id="email" type="email" placeholder="Email" autocomplete="email" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <input id="inviteCode" type="text" placeholder="Sign-up code (if you were given one)" hidden />
      <button type="submit" id="authSubmit">Sign in</button>
      <p id="authErr" class="err" hidden></p>
      <p class="muted switch">
        <span id="switchText">New here?</span>
        <button type="button" id="switchMode" class="linkbtn">Create an account</button>
      </p>
    </form>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">Job Search Engine <span class="tag">Profile</span></div>
      <div class="top-right">
        <div class="overall">
          <span class="overall-label">Profile strength</span>
          <div class="bar"><div id="overallFill" class="fill"></div></div>
          <span id="overallPct" class="pct">0%</span>
        </div>
        <div class="usermenu">
          <span id="whoami" class="muted"></span>
          <button id="logout" class="ghost">Log out</button>
        </div>
      </div>
    </header>

    <div id="actionBanner" class="action-banner" hidden></div>

    <div class="layout">
      <nav id="blockNav" class="blocknav"></nav>
      <main id="blocks" class="content"></main>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
